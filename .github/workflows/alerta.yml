name: alerta-venta

on:
  schedule:
    # 2 min después de cada cierre de vela de 15m, lunes a viernes (hora UTC)
    - cron: "2,17,32,47 * * * 1-5"
  workflow_dispatch:
    inputs:
      modo:
        description: "run / test / backtest"
        default: "run"

permissions:
  contents: write

concurrency:
  group: alerta-venta
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar patrón
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODO: ${{ inputs.modo }}
        run: python3 detector.py "${MODO:-run}"

      - name: Guardar estado
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "bot"
            git config user.email "bot@users.noreply.github.com"
            git add state.json
            git commit -m "estado"
            git push
          fi
