name: alerta-venta

on:
  schedule:
    # 2 min después de cada cierre de vela de 15m, lunes a viernes (hora UTC)
    - cron: "2,17,32,47 * * * 1-5"
  workflow_dispatch:
    inputs:
      modo:
        description: "run / test / backtest / historico"
        default: "run"
      dias:
        description: "Días de historial (solo para modo historico)"
        default: "365"

permissions:
  contents: write

concurrency:
  group: alerta-venta
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Revisar patrón
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          MODO: ${{ inputs.modo }}
          DIAS: ${{ inputs.dias }}
        run: python3 detector.py "${MODO:-run}"

      - name: Guardar estado y datos
        if: always()
        run: |
          git add -A
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "bot"
            git config user.email "bot@users.noreply.github.com"
            git commit -m "datos"
            git push
          fi
